name: CD - Model Registry & Versioning

on:
  workflow_run:
    workflows: ["ci"]  # matches name in ci.yml (case-sensitive)
    types: [completed]
    branches: [main]

jobs:
  register-model:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install typer

      - name: Install local multi-packages (CRISP-DM phases)
        run: |
          pip install ./packages/proyecto-core
          pip install ./packages/proyecto-bu
          pip install ./packages/proyecto-du
          pip install ./packages/proyecto-dp
          pip install ./packages/proyecto-modeling
          pip install ./packages/proyecto-eval
          pip install ./packages/proyecto-deploy

      - name: Download spaCy model
        run: python -m spacy download es_core_news_sm

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('stopwords')"
      
      - name: Run full pipeline
        run: |
          python -m proyecto_mlops.cli all
      
      - name: Generate model metadata
        run: |
          python -c "
          import json
          from datetime import datetime
          metadata = {
            'timestamp': datetime.now().isoformat(),
            'version': 'v${{ github.run_number }}',
            'commit_sha': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}'
          }
          with open('models/metadata.json', 'w') as f:
            json.dump(metadata, f, indent=2)
          "
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modelo-${{ github.run_number }}
          path: models/
          retention-days: 30
      
      - name: Update model registry
        run: |
          echo "✅ Modelo registrado: v${{ github.run_number }}"
