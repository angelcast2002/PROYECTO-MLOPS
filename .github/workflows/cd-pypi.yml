name: CD - PyPI Package Release 

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'publish target (testpypi|pypi)'
        required: true
        default: 'testpypi'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NLTK (for downloader)
        run: |
          python -m pip install --upgrade pip
          pip install nltk

      - name: Prepare NLTK data
        run: |
          python - << 'PY'
          import os, nltk
          d = os.path.expanduser('~/nltk_data')
          os.makedirs(d, exist_ok=True)
          nltk.download('stopwords', download_dir=d)
          print('NLTK data at', d)
          PY
        env:
          NLTK_DATA: ${{ github.workspace }}/../nltk_data

      - name: Clean dist
        run: rm -rf dist

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build twine

      - name: Build package
        run: python -m build

      - name: Show dist files
        run: ls -l dist/

      - name: Publish to TestPyPI (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          verbose: true

      - name: Publish to PyPI (tag push)
        if: ${{ github.event_name == 'push' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

      - name: Test installation from TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
        run: |
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple proyecto-mlops
          python -c "import proyecto_mlops; print(proyecto_mlops.__version__)"
        env:
          NLTK_DATA: ${{ github.workspace }}/../nltk_data

      - name: Test installation from PyPI
        if: ${{ github.event_name == 'push' }}
        run: |
          pip install proyecto-mlops
          python -c "import proyecto_mlops; print(proyecto_mlops.__version__)"
        env:
          NLTK_DATA: ${{ github.workspace }}/../nltk_data

      - name: Create Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
