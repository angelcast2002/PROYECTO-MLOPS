name: CD - Docker Build and Push

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'proyecto_mlops/**'
      - '.github/workflows/cd-docker.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "__version__" proyecto_mlops/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proyecto-mlops:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/proyecto-mlops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Update deployment
        run: |
          echo "🐳 Image pushed: ${{ secrets.DOCKER_USERNAME }}/proyecto-mlops:${{ steps.version.outputs.VERSION }}"
